# Starship prompt — mirrors the old Powerlevel10k "lean" look:
#   ~/dir branch ............................ 2s 14:32:05
#   >
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
format = """
$directory$git_branch$git_state\
$fill\
$status$cmd_duration$jobs$time
$character"""

[directory]
style = "blue"
truncation_length = 0
truncate_to_repo = false
read_only = " ro"

[git_branch]
format = "[$branch]($style) "
style = "green"

[git_state]
style = "yellow"

[fill]
symbol = "."
style = "black"

[status]
disabled = false
format = "[$status]($style) "
style = "red"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[jobs]
format = "[$symbol$number]($style) "
style = "red"

[time]
disabled = false
format = "[$time]($style)"
style = "cyan"
time_format = "%H:%M:%S"

[character]
success_symbol = "[>](green)"
error_symbol = "[>](red)"
